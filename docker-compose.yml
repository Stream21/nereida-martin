# Base de datos local con persistencia (Docker en WSL).
# Desde Windows:  cd backend && npm run db:up
# Desde WSL:      docker-compose up -d

services:
  db:
    image: postgres:16-alpine
    container_name: nere-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nere_studio
    volumes:
      - nere_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nere_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nere_pg_data:
